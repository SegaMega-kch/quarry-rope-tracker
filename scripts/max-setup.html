<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение MAX | Рапорт мастера</title>
  <style nonce="__NONCE__">
    @font-face { font-family: Plex; src: url('/font-info') format('woff2'); font-display: swap; }
    @font-face { font-family: PlexAction; src: url('/font-action') format('woff2'); font-display: swap; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; background: #f7f7f5; color: #202020; font: 16px/1.5 Plex, sans-serif; }
    main { max-width: 480px; margin: 64px auto; padding: 0 24px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    img { width: 56px; height: 56px; border-radius: 8px; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 600; }
    header p { margin: 4px 0 0; color: #555; }
    .group { margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid #ded9d2; }
    .group span { display: block; font-size: 14px; color: #555; margin-bottom: 4px; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; min-width: 0; min-height: 48px; padding: 10px 12px; font: 16px/1.4 Plex, sans-serif; color: #202020; background: white; border: 1px solid #777; border-radius: 6px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #286a44; outline-offset: 3px; }
    button { margin-top: 18px; width: 100%; min-height: 48px; padding: 10px 16px; border: 1px solid #d75d00; border-radius: 6px; background: #f47a14; color: #171717; font: 600 18px/1.4 PlexAction, sans-serif; cursor: pointer; }
    button:hover:not(:disabled) { background: #e96d09; }
    button:disabled { cursor: default; background: #e4e4df; color: #555; border-color: #a7a7a0; }
    .privacy { margin: 12px 0 0; font-size: 14px; color: #555; }
    #status { min-height: 72px; margin-top: 24px; overflow-wrap: anywhere; }
    #status.error { color: #a32013; }
    #status.success { color: #23643a; }
    @media (max-width: 520px) { main { margin-top: 32px; padding-inline: 20px; } }
  </style>
</head>
<body>
  <main>
    <header><img src="/avatar" alt="" width="56" height="56"><div><h1>Подключение MAX</h1><p>Рапорт мастера</p></div></header>
    <p class="group"><span>Группа для отчётов</span>Главный карьер</p>
    <form id="form" autocomplete="off">
      <label for="token">Токен бота</label>
      <input id="token" type="password" required maxlength="4096" autocomplete="off" spellcheck="false" aria-describedby="privacy status">
      <p id="privacy" class="privacy">Локальное подключение. Без отправки сообщений.</p>
      <button id="submit" type="submit">Проверить токен</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript>Для подключения включите JavaScript.</noscript>
  </main>
  <script nonce="__NONCE__">
    const form = document.getElementById('form');
    const input = document.getElementById('token');
    const button = document.getElementById('submit');
    const status = document.getElementById('status');
    let complete = false;
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      input.readOnly = true;
      status.className = '';
      status.textContent = 'Проверяем подключение к MAX…';
      try {
        const response = await fetch('/token', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Setup-Nonce': '__NONCE__' },
          body: JSON.stringify({ token: input.value.trim() }), cache: 'no-store'
        });
        const result = await response.json();
        status.textContent = result.message;
        complete = response.ok && result.ok === true;
        status.className = complete ? 'success' : 'error';
        if (complete) { input.value = ''; input.disabled = true; button.textContent = 'Токен проверен'; }
      } catch {
        status.className = 'error';
        status.textContent = 'Локальное окно недоступно. Попросите открыть его заново.';
      } finally {
        if (!complete) { button.disabled = false; input.readOnly = false; }
      }
    });
    window.addEventListener('pagehide', () => { input.value = ''; });
  </script>
</body>
</html>
